<div class="col-md-6 offset-md-3">
  <h3>Create Employee</h3>
  <form (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>First Name</label>
      <input type="text" class="form-control" id="firstName"
        [(ngModel)]="employee.firstName" name="firstName">
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" class="form-control" id="lastName"
        [(ngModel)]="employee.lastName" name="lastName">
    </div>

    <div class="form-group">
      <label>Email Id</label>
      <input type="text" class="form-control" id="emailId"
        [(ngModel)]="employee.emailId" name="emailId">
    </div>

    <div class="form-group">
      <label>Department</label>
      <select class="form-control" name="department"
        [(ngModel)]="employee.department">
        <option [ngValue]="null">-- Select Department --</option>
        <option *ngFor="let dept of departments" [ngValue]="dept">
          {{ dept.name }}
        </option>
      </select>
    </div>

    <button class="btn btn-success" type="submit" style="margin-top: 12px;">
      Submit
    </button>

  </form>
</div>
