<h2>Employee List</h2>

<!-- Search Bar -->
<div style="margin-bottom: 16px;">
  <input
    type="text"
    [(ngModel)]="searchKeyword"
    (input)="onSearch()"
    placeholder="Search by name or email..."
    class="form-control"
    style="width: 300px;"
  />
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th> First Name </th>
      <th> Last Name </th>
      <th> Email Id </th>
      <th> Actions </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let employee of employees">
      <td>{{ employee.firstName }}</td>
      <td>{{ employee.lastName }}</td>
      <td>{{ employee.emailId }}</td>
      <td>
        <button class="btn btn-info" (click)="updateEmployee(employee.id)">
          Update
        </button>

        <button class="btn btn-danger" (click)="deleteEmployee(employee.id)" style="margin-left:10px;">
          Delete
        </button>

        <button class="btn btn-dark" (click)="employeeDetails(employee.id)" style="margin-left:10px;">
          View
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- No results message -->
<div *ngIf="employees.length === 0" style="margin-top: 16px; color: gray;">
  No employees found.
</div>
