<h2>Department List</h2>

<button
  class="btn btn-primary"
  style="margin-bottom: 16px"
  routerLink="/create-department"
  *ngIf="isAdmin()"
>
  Add Department
</button>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let department of departments">
      <td>{{ department.name }}</td>
      <td>{{ department.description }}</td>
      <td>
        <button
          class="btn btn-info"
          (click)="updateDepartment(department.id)"
          [disabled]="!isAdmin()"
          [style.opacity]="isAdmin() ? '1' : '0.5'"
          [title]="isAdmin() ? '' : 'Only ADMIN can perform this action'"
        >
          Update
        </button>

        <button
          class="btn btn-danger"
          (click)="deleteDepartment(department.id)"
          [disabled]="!isAdmin()"
          [style.opacity]="isAdmin() ? '1' : '0.5'"
          [title]="isAdmin() ? '' : 'Only ADMIN can perform this action'"
          style="margin-left: 10px"
        >
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="departments.length === 0" style="color: gray">
  No departments found.
</div>
