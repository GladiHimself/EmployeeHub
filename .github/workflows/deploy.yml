name: EmployeeHub CI/CD

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build backend
        working-directory: employee-backend
        run: mvn clean package -DskipTests

      - name: Run tests
        working-directory: employee-backend
        run: mvn test
        continue-on-error: true

  notify-deployments:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Railway deploys automatically
        run: echo "Railway auto-deploys backend on push to main ✅"

      - name: Vercel deploys automatically
        run: echo "Vercel auto-deploys frontend on push to main ✅"